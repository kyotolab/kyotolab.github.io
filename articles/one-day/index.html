<body>

<style>
  :root{
    --paper:#FFFFFF; --surface:#F5F5F7;
    --ink:#1D1D1F; --ink-soft:#4A4A4E; --muted:#6E6E73;
    --rule:rgba(0,0,0,.12); --rule-soft:rgba(0,0,0,.08);
    --accent:#0066CC; --accent-ink:#0052A6; --accent-soft:#EAF2FD;
    --kamo:#8FAEB2;
    --ochre:#A33A2C; --ochre-soft:#FBEDEA;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    --serif:var(--sans);
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --gut:clamp(20px,4vw,48px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#000000; --surface:#1C1C1E;
      --ink:#F5F5F7; --ink-soft:#C7C7CC; --muted:#98989D;
      --rule:rgba(255,255,255,.16); --rule-soft:rgba(255,255,255,.1);
      --accent:#0A84FF; --accent-ink:#5AC8FA; --accent-soft:#12233A;
      --kamo:#517379; --ochre:#FF6F5E; --ochre-soft:#2B1512;
    }
  }
  :root[data-theme="dark"]{
    --paper:#000000; --surface:#1C1C1E;
    --ink:#F5F5F7; --ink-soft:#C7C7CC; --muted:#98989D;
    --rule:rgba(255,255,255,.16); --rule-soft:rgba(255,255,255,.1);
    --accent:#0A84FF; --accent-ink:#5AC8FA; --accent-soft:#12233A;
    --kamo:#517379; --ochre:#FF6F5E; --ochre-soft:#2B1512;
  }

  *{box-sizing:border-box}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0; font-family:var(--serif); font-weight:700; letter-spacing:-.035em; line-height:1.16; font-feature-settings:"palt" 1; text-wrap:balance}
  p{margin:0}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}

  .wrap{max-width:760px; margin:0 auto; padding-inline:var(--gut)}
  .wide{max-width:920px; margin:0 auto; padding-inline:var(--gut)}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}

  /* ---- language bar ---- */
  .langbar{position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--paper) 93%, transparent); backdrop-filter:saturate(1.2) blur(8px); border-bottom:1px solid var(--rule)}
  .langbar .wide{display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:56px; flex-wrap:wrap}
  .brand{display:flex; align-items:baseline; gap:9px}
  .brand b{font-family:var(--serif); font-weight:800; font-size:16px; letter-spacing:.05em}
  .brand span{font-family:var(--mono); font-size:9.5px; letter-spacing:.18em; color:var(--muted)}
  .langs{display:flex; gap:5px; flex-wrap:wrap}
  .langs button{font-size:12.5px; padding:5px 12px; border:1px solid var(--rule); border-radius:99px; color:var(--muted); line-height:1.6}
  .langs button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--surface)}

  /* ---- masthead ---- */
  header.doc{padding-block:clamp(34px,5.5vw,58px) 30px; border-bottom:1px solid var(--rule)}
  .kicker{display:flex; align-items:center; gap:10px; margin-bottom:18px}
  .kicker .rule{width:38px; height:1px; background:var(--accent)}
  header.doc h1{font-size:clamp(27px,4.6vw,43px); font-weight:800; letter-spacing:.01em}
  header.doc h1 em{font-style:normal; color:var(--accent-ink); display:block; margin-top:4px}
  header.doc .lede{margin-top:20px; color:var(--ink-soft); font-size:16px; max-width:62ch}
  .facts{margin-top:28px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule)}
  @media (max-width:640px){ .facts{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .fact{background:var(--paper); padding:12px 14px}
  .fact dt{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; color:var(--muted); display:block; margin-bottom:2px}
  .fact dd{margin:0; font-family:var(--serif); font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.4}
  .fact dd small{font-family:var(--sans); font-size:11px; font-weight:400; color:var(--muted); margin-left:3px}

  section{padding-block:clamp(36px,5vw,54px); border-bottom:1px solid var(--rule)}
  .sec-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px}
  h2{font-size:clamp(20px,2.6vw,26px)}
  .body{margin-top:14px; color:var(--ink-soft); font-size:15.5px; max-width:64ch}
  .body em{font-style:normal; background:linear-gradient(transparent 62%, var(--accent-soft) 62%); padding:0 2px}

  /* ---- diagram ---- */
  figure.shape{margin:0}
  figure.shape svg{display:block; width:100%; height:auto; overflow:visible}
  .zbox{fill:var(--surface); stroke:var(--rule); stroke-width:1}
  .zname{font-family:var(--serif); font-size:14px; fill:var(--ink); font-weight:600}
  .ztime{font-family:var(--mono); font-size:9.5px; fill:var(--accent); letter-spacing:.08em}
  .zlist{font-family:var(--sans); font-size:10.5px; fill:var(--muted)}
  .zacc{font-family:var(--sans); font-size:10.5px; fill:var(--accent)}
  .rpath{fill:none; stroke:var(--accent); stroke-width:1.6; stroke-dasharray:5 4}
  .rdot{fill:var(--accent)}
  .rnum{font-family:var(--mono); font-size:9px; fill:var(--paper); font-weight:600}
  .river{fill:none; stroke:var(--kamo); stroke-width:3; stroke-linecap:round}
  .rlabel{font-family:var(--sans); font-size:10px; fill:var(--muted)}
  figcaption{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:var(--muted); margin-top:14px; text-align:right}

  /* ---- itinerary ---- */
  .plan{margin-top:24px; border-top:1px solid var(--rule)}
  .stop{display:grid; grid-template-columns:80px minmax(0,1fr); gap:clamp(14px,3vw,26px); padding:21px 0; border-bottom:1px solid var(--rule-soft)}
  @media (max-width:620px){ .stop{grid-template-columns:1fr; gap:8px} }
  .when{font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums; color:var(--accent-ink); padding-top:2px}
  .when small{display:block; font-size:10px; color:var(--muted); letter-spacing:.06em; margin-top:2px}
  .stop-head{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-bottom:6px}
  .stop-head h3{font-size:18px}
  .kanji{font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:.04em}
  .ward{display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; padding:2px 7px; border-radius:2px; line-height:1.7; white-space:nowrap; border:1px solid}
  .w-h{color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 50%,transparent); background:var(--accent-soft)}
  .w-n{color:var(--ochre); border-color:color-mix(in srgb,var(--ochre) 50%,transparent); background:var(--ochre-soft)}
  .w-s{color:var(--muted); border-color:var(--rule); background:var(--surface)}
  .stop p{font-size:14.5px; color:var(--ink-soft); max-width:64ch}
  .stop p b{color:var(--ink)}
  .meta{margin-top:10px; display:flex; gap:5px 14px; flex-wrap:wrap}
  .meta span{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.03em}
  .meta span b{color:var(--ink-soft); font-weight:500}
  .move{display:grid; grid-template-columns:80px minmax(0,1fr); gap:clamp(14px,3vw,26px); padding:8px 0; border-bottom:1px solid var(--rule-soft)}
  @media (max-width:620px){ .move{grid-template-columns:1fr; gap:2px} }
  .move .when{font-size:10.5px; color:var(--muted); padding-top:0}
  .move p{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.02em}

  /* ---- pitfalls / cuts / fares ---- */
  .pits{margin-top:22px; border-top:1px solid var(--rule)}
  .pit{display:grid; grid-template-columns:104px minmax(0,1fr); gap:clamp(14px,3vw,26px); padding:19px 0; border-bottom:1px solid var(--rule-soft)}
  @media (max-width:620px){ .pit{grid-template-columns:1fr; gap:6px} }
  .pit .k{font-family:var(--serif); font-size:15px; color:var(--accent-ink); font-weight:600}
  .pit h3{font-size:16.5px; margin-bottom:6px}
  .pit p{font-size:14.5px; color:var(--ink-soft); max-width:62ch}
  .pit p b{color:var(--ink)}

  .cuts{margin-top:20px; display:grid; gap:1px; background:var(--rule); border:1px solid var(--rule)}
  .cut{background:var(--paper); display:grid; grid-template-columns:150px minmax(0,1fr); gap:18px; padding:13px 16px; align-items:baseline}
  @media (max-width:560px){ .cut{grid-template-columns:1fr; gap:3px} }
  .cut b{font-family:var(--serif); font-size:15px; font-weight:600}
  .cut span{font-size:13.5px; color:var(--ink-soft)}
  .cut span b{font-family:var(--sans); font-size:13.5px; color:var(--ink)}

  .tablewrap{margin-top:20px; overflow-x:auto; border-top:1px solid var(--rule)}
  table{width:100%; border-collapse:collapse; font-size:14px; min-width:480px}
  th,td{text-align:left; vertical-align:top; padding:10px 16px 10px 0; border-bottom:1px solid var(--rule-soft)}
  th{font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; font-weight:500}
  td:first-child{padding-right:22px}
  td.n{font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
  td small{display:block; color:var(--muted); font-size:12px; line-height:1.7}

  .callout{margin-top:22px; border-left:2px solid var(--ochre); background:var(--ochre-soft); padding:16px 20px; border-radius:0 3px 3px 0}
  .callout .tag{display:block; color:var(--ochre); margin-bottom:8px}
  .callout p{font-size:13.5px; color:var(--ink-soft); max-width:64ch}
  .callout p + p{margin-top:8px}
  .callout p b{color:var(--ink)}

  footer{padding-block:32px 44px}
  footer .box{border:1px solid var(--rule); border-radius:3px; background:var(--surface); padding:22px 24px}
  footer .box .tag{display:block; margin-bottom:10px}
  footer .box h3{font-size:17px; margin-bottom:8px}
  footer .box p{font-size:13.5px; color:var(--ink-soft); max-width:62ch}
  footer .sig{margin-top:18px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap}
  footer .sig p{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:var(--muted)}

  :focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>

    facts:[["Duration","13","hrs"],["On foot","11","km"],["Admissions","2,600","yen approx."],["Transport","1,100","yen day pass"]],
    shapeH:"The shape of the day", shapeTag:"Overview",

    plan:[
      {t:"06:00", d:"morning", n:"Kiyomizu-dera", k:"清水寺", w:"h",
       p:"Opens at 6:00 every day of the year. No other major temple in Kyoto opens this early. There are minutes when fewer than ten people stand on the wooden stage, with the city below under morning haze. At eleven, that same stage holds several hundred. <b>This is the one appointment on this day you cannot move.</b>",
       m:[["Admission","¥500"],["Stay","50 min"],["Opens","6:00"]]},
      {mv:"Walk 15 min", mt:"Down Kiyomizu-zaka → Sannenzaka → Ninenzaka"},
      {t:"07:00", d:"morning", n:"Sannenzaka, Ninenzaka & Yasaka Pagoda", k:"三年坂・二年坂・八坂の塔", w:"h",
       p:"Stone lanes lined with wooden townhouses. After ten you move with the crowd rather than walk through it; at seven the shops are still shut and you see the street itself instead. The view up to Yasaka Pagoda from the foot of the slope is the most photographed frame in Kyoto. This is the only hour it holds nobody else.",
       m:[["Free",""],["Stay","40 min"],["Slopes and steps",""]]},
      {mv:"Walk 12 min", mt:"Nene-no-Michi → through Maruyama Park"},

       p:"Yasaka Shrine has no closing gate: open all night, no admission. It stands at the eastern end of Shijō-dōri, facing back down the street into the city. Maruyama Park behind it is where people walk their dogs at this hour. The line between a tourist site and a neighbourhood is clearest in the morning.",

      {t:"08:20", d:"breakfast", n:"Breakfast around Gion and Shijō", k:"", w:"h",
       p:"Few places open this early. A kissaten — an old-style coffee house — serving a morning set, a convenience store, a bakery. Kyoto's kissaten culture runs deep and several long-standing ones open from seven, scattered between Shijō and Sanjō. Sit down here. <b>You are walking eleven kilometres today.</b>",
       m:[["Budget","¥600–1,200"],["Stay","50 min"]]},
      {t:"09:15", d:"morning", n:"Gion and Hanamikōji", k:"祇園・花見小路", w:"h",
       p:"Teahouses along a stone-paved street. <b>There are photography rules here.</b> The private lanes leading off Hanamikōji prohibit unauthorised photography and are signposted. The main street is fine; do not point a camera down the private lanes, or at the people using them. This is not etiquette — it is where people live and work.",
       m:[["Free",""],["Stay","35 min"],["Private lanes","no photos"]]},
      {mv:"Walk 6 min", mt:"South through Hanamikōji"},
      {t:"10:00", d:"morning", n:"Kennin-ji", k:"建仁寺", w:"h",
       p:"Directly behind Gion, and quiet. Japan's oldest Zen temple; twin dragons are painted across the ceiling of the Dharma Hall. It is also the only place on this route where you can sit on tatami and look at a garden for a while. Coming in off the crowded lanes, the city suddenly goes a long way away.",
       m:[["Admission","¥800"],["Stay","60 min"],["Opens","10:00"]]},
      {mv:"Walk 15 min", mt:"Shijō-dōri → cross the river at Shijō-Ōhashi → Nakagyō"},
      {t:"11:15", d:"lunch", n:"Nishiki Market", k:"錦市場", w:"n",
       p:"A four-hundred-year-old food market, now mostly visitors. <b>Please do not eat while walking.</b> The merchants ask people to stop at the shopfront and eat there; it is a litter and congestion problem, not a rule invented for tourists. Most stalls give you somewhere to stand. Shops open around 9:30–10:00, varying by stall.",

       p:"A UNESCO World Heritage site, and <b>free to enter</b>. Goeidō Hall is among the largest wooden buildings in Japan, and you can walk in and sit down on the tatami. Because it sits off the standard circuit there are few people, and the late light runs long across the veranda. This may be the most luxurious half hour of the day.",

    fricH:"Four things that actually trip people up", fricTag:"Friction",
    fricBody:"Every guide has the sights. These four are what they leave out — the things we hear again and again from the people running shops here.",
    pits:[

  var state = { lang: "en" };

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function svgShape(d){
    var out = '<svg viewBox="0 0 900 320" role="img" aria-label="' + esc(d.shapeH) + '">';
    out += '<path class="river" d="' + GEO.river + '"></path>';
    out += '<text class="rlabel" x="482" y="312">' + esc(d.river) + '</text>';
    d.zones.forEach(function(z, i){
      var g = GEO.zones[i];
      out += '<rect class="zbox" x="'+g.x+'" y="'+g.y+'" width="'+g.w+'" height="'+g.h+'" rx="3"></rect>';
      out += '<text class="ztime" x="'+(g.x+18)+'" y="'+(g.y+26)+'">'+esc(z.t)+'</text>';
      out += '<text class="zname" x="'+(g.x+18)+'" y="'+(g.y+50)+'">'+esc(z.n)+'</text>';
      z.l.forEach(function(line, j){
        out += '<text class="zlist" x="'+(g.x+18)+'" y="'+(g.y+74+j*20)+'">'+esc(line)+'</text>';
      });
      if(z.a){
        out += '<text class="zacc" x="'+(g.x+18)+'" y="'+(g.y+122)+'">'+esc(z.a)+'</text>';
      }
    });
    GEO.paths.forEach(function(p){ out += '<path class="rpath" d="'+p+'"></path>'; });
    GEO.dots.forEach(function(c, i){
      out += '<circle class="rdot" cx="'+c[0]+'" cy="'+c[1]+'" r="10"></circle>';
      out += '<text class="rnum" x="'+c[0]+'" y="'+(c[1]+3.5)+'" text-anchor="middle">'+(i+1)+'</text>';
    });
    return out + '</svg>';
  }

      h += '<div class="fact"><dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'<small>'+esc(f[2])+'</small></dd></div>';
    });
    h += '</dl></div></header>';

    /* shape */
    h += '<section><div class="wide">';
    h += '<div class="sec-head"><h2>'+esc(d.shapeH)+'</h2><span class="tag">'+esc(d.shapeTag)+'</span></div>';
    h += '<p class="body">' + d.shapeBody + '</p>';
    h += '<figure class="shape">' + svgShape(d) + '<figcaption>'+esc(d.shapeCap)+'</figcaption></figure>';
    h += '</div></section>';

    /* itinerary */
    h += '<section><div class="wrap">';
    h += '<div class="sec-head"><h2>'+esc(d.planH)+'</h2><span class="tag">'+esc(d.planTag)+'</span></div>';
    h += '<p class="body">' + d.planBody + '</p>';
    h += '<div class="plan">';
    d.plan.forEach(function(it){
      if(it.mv){
        h += '<div class="move"><div class="when">'+esc(it.mv)+'</div><p>'+esc(it.mt)+'</p></div>';
        return;
      }
      h += '<article class="stop">';
      h += '<div class="when">'+esc(it.t)+'<small>'+esc(it.d)+'</small></div><div>';
      h += '<div class="stop-head"><h3>'+esc(it.n)+'</h3>';
      if(it.k){ h += '<span class="kanji">'+esc(it.k)+'</span>'; }
      h += '<span class="ward w-'+it.w+'">'+esc(d.wards[it.w])+'</span></div>';
      h += '<p>' + it.p + '</p>';
      h += '<div class="meta">';
      it.m.forEach(function(mm){
        h += '<span>'+esc(mm[0])+(mm[1] ? ' <b>'+esc(mm[1])+'</b>' : '')+'</span>';
      });
      h += '</div></div></article>';
    });
    h += '</div></div></section>';

    /* friction */
    h += '<section><div class="wrap">';
    h += '<div class="sec-head"><h2>'+esc(d.fricH)+'</h2><span class="tag">'+esc(d.fricTag)+'</span></div>';
    h += '<p class="body">'+esc(d.fricBody)+'</p><div class="pits">';
    d.pits.forEach(function(pt){
      h += '<div class="pit"><div class="k">'+esc(pt.k)+'</div><div><h3>'+esc(pt.h)+'</h3><p>'+pt.p+'</p></div></div>';
    });
    h += '</div></div></section>';

    /* cuts */
    h += '<section><div class="wrap">';
    h += '<div class="sec-head"><h2>'+esc(d.cutH)+'</h2><span class="tag">'+esc(d.cutTag)+'</span></div>';
    h += '<p class="body">'+d.cutBody+'</p><div class="cuts">';
    d.cuts.forEach(function(c){
      h += '<div class="cut"><b>'+esc(c[0])+'</b><span>'+c[1]+'</span></div>';
    });
    h += '</div></div></section>';

    /* fares */
    h += '<section><div class="wrap">';
    h += '<div class="sec-head"><h2>'+esc(d.fareH)+'</h2><span class="tag">'+esc(d.fareTag)+'</span></div>';
    h += '<div class="tablewrap"><table><thead><tr>';
    d.fareHead.forEach(function(th){ h += '<th>'+esc(th)+'</th>'; });
    h += '</tr></thead><tbody>';
    d.fares.forEach(function(r){
      h += '<tr><td>'+esc(r[0])+'</td><td class="n">'+esc(r[1])+'</td><td><small>'+esc(r[2])+'</small></td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="callout"><span class="tag">'+esc(d.coTag)+'</span><p>'+d.co1+'</p><p>'+d.co2+'</p></div>';
    h += '</div></section>';

    /* footer */
    h += '<footer><div class="wrap"><div class="box">';
    h += '<span class="tag">'+esc(d.ftTag)+'</span><h3>'+esc(d.ftH)+'</h3><p>'+esc(d.ftP)+'</p></div>';
    h += '<div class="sig"><p>'+esc(d.sig1)+'</p><p>'+esc(d.sig2)+'</p></div>';
    h += '</div></footer>';

    document.getElementById("app").innerHTML = h;

    var btns = document.querySelectorAll("#langs button");
    for(var i=0;i<btns.length;i++){
      btns[i].setAttribute("aria-pressed", btns[i].dataset.lang === state.lang);
    }
  }

  var lb = document.getElementById("langs");
  lb.innerHTML = LANGS.map(function(l){
    return '<button data-lang="'+l.k+'" aria-pressed="'+(state.lang===l.k)+'">'+l.n+'</button>';
  }).join("");
  lb.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b || !b.dataset.lang) return;
    state.lang = b.dataset.lang;
    render();
    window.scrollTo(0,0);
  });

  render();
})();
</script>


</body>
</html>
