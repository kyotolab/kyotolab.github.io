<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Menu — Kyoto Lab</title>
<style>
  :root{
    color-scheme: light dark;
    --paper:#F5F5F7; --screen:#FFFFFF;
    --ink:#1D1D1F; --ink-soft:#4A4A4E; --muted:#6E6E73;
    --rule:rgba(0,0,0,.12); --rule-soft:rgba(0,0,0,.08);
    --accent:#0066CC; --accent-ink:#0052A6; --accent-soft:#EAF2FD;
    --ochre:#A33A2C;
    --alert:#9C4A34; --alert-soft:#F4E3DE;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#000000; --screen:#1C1C1E;
      --ink:#F5F5F7; --ink-soft:#C7C7CC; --muted:#98989D;
      --rule:rgba(255,255,255,.16); --rule-soft:rgba(255,255,255,.1);
      --accent:#0A84FF; --accent-ink:#5AC8FA; --accent-soft:#12233A;
      --ochre:#FF6F5E;
      --alert:#DE9280; --alert-soft:#33211C;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--paper)}
  body{color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.02em; line-height:1.25; text-wrap:balance; font-feature-settings:"palt" 1}
  p{margin:0}
  button{font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit; padding:0}
  .app{max-width:560px; margin:0 auto; min-height:100vh; background:var(--screen); padding-bottom:96px}

  .bar{position:sticky; top:0; z-index:5; background:var(--screen); padding:14px 16px 12px; border-bottom:1px solid var(--rule-soft)}
  .bar h1{font-size:18px}
  .row{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center}
  .chip{font-size:12.5px; padding:6px 12px; border:1px solid var(--rule); border-radius:99px; color:var(--muted); line-height:1.5}
  .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--screen)}
  .chip.f[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-ink)}
  .flabel{font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:.1em}
  .feebar{margin-top:10px; padding:8px 10px; border:1px solid var(--rule); border-radius:4px; background:var(--paper); font-size:12px; line-height:1.55; color:var(--ink-soft)}
  .notice{margin:12px 16px 0; padding:10px 12px; border-radius:4px; background:var(--alert-soft); color:var(--alert); font-size:13px}

  .cat{font-size:13px; color:var(--muted); letter-spacing:.08em; padding:18px 16px 6px; border-bottom:1px solid var(--rule-soft)}
  .dish{display:grid; grid-template-columns:minmax(0,1fr) auto; border-bottom:1px solid var(--rule-soft)}
  .dish .open{display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:12px; text-align:left; padding:14px 8px 14px 16px}
  .art{width:52px; height:46px}
  .art svg,.big-art svg{width:100%; height:100%; display:block; stroke:var(--accent); fill:none; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round}
  .nm{display:block; font-weight:600; line-height:1.5}
  .ja{display:block; font-size:11.5px; color:var(--muted)}
  .desc{display:block; font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.6}
  .price{font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; padding-top:2px}
  .flags{display:flex; gap:4px; flex-wrap:wrap; margin-top:6px}
  .flag{font-size:10.5px; padding:1px 6px; border-radius:2px; border:1px solid var(--rule); color:var(--muted); line-height:1.7; white-space:nowrap}
  .flag.ok{color:var(--accent-ink); border-color:var(--accent); background:var(--accent-soft)}
  .flag.warn,.flag.out{color:var(--alert); border-color:var(--alert); background:var(--alert-soft)}
  .dish.is-out .open{opacity:.5}
  .add{align-self:center; margin-right:14px; width:40px; height:40px; border-radius:99px; border:1px solid var(--accent); color:var(--accent-ink); font-size:20px; line-height:1}
  .add[disabled]{border-color:var(--rule); color:var(--muted); cursor:not-allowed}
  .incart{display:block; font-family:var(--mono); font-size:10px; color:var(--accent-ink); text-align:center; margin:-6px 14px 0 0}
  .empty{padding:32px 20px; text-align:center; color:var(--muted); font-size:13px}
  .empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:6px}

  .cartbar{position:fixed; left:0; right:0; bottom:0; z-index:10; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,var(--paper) 30%)}
  .cartbar button{display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; max-width:536px; margin:0 auto; padding:14px 18px; border-radius:10px; background:var(--accent); color:var(--screen); font-weight:700}
  .cartbar small{font-weight:400; opacity:.9}

  .sheet{position:fixed; inset:0; z-index:20; background:var(--screen); overflow-y:auto; overscroll-behavior:contain}
  .sheet-in{max-width:560px; margin:0 auto; padding:0 18px 40px}
  .sheet-top{position:sticky; top:0; background:var(--screen); display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--rule-soft); z-index:1}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
  .close{font-size:12px; color:var(--muted); border:1px solid var(--rule); border-radius:99px; padding:5px 14px}
  .big-art{height:96px; margin:20px auto 12px; width:110px}
  .sheet h2{font-size:22px}
  .sec{margin-top:20px; padding-top:14px; border-top:1px solid var(--rule-soft)}
  .sec .tag{display:block; margin-bottom:8px}
  .diet{display:grid; gap:6px; font-size:13px; color:var(--ink-soft)}
  .diet .y{color:var(--accent-ink)} .diet .n{color:var(--alert)}
  .stepper{display:flex; align-items:center; justify-content:center; gap:18px; margin-top:22px}
  .stepper button{width:42px; height:42px; border:1px solid var(--rule); border-radius:99px; font-size:20px; color:var(--accent-ink); line-height:1}
  .stepper .n{font-family:var(--mono); font-size:24px; min-width:40px; text-align:center; font-variant-numeric:tabular-nums}
  .primary{display:block; width:100%; margin-top:20px; padding:15px; border-radius:8px; background:var(--accent); color:var(--screen); font-weight:700; font-size:16px}
  .primary[disabled]{background:var(--rule); color:var(--muted); cursor:not-allowed}

  .lead{text-align:center; font-size:13px; color:var(--ink-soft); padding:16px 0; border-bottom:1px dashed var(--rule)}
  .plz{text-align:center; font-size:15px; color:var(--muted); letter-spacing:.1em; margin-top:18px}
  .lines{margin-top:10px}
  .line{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:12px 0; border-bottom:1px solid var(--rule-soft)}
  .line .jn{font-size:21px; font-weight:800; line-height:1.35}
  .line .gn{font-size:12px; color:var(--muted)}
  .line .q{display:flex; align-items:center; gap:8px}
  .line .q button{width:34px; height:34px; border:1px solid var(--rule); border-radius:99px; color:var(--accent-ink); font-size:17px; line-height:1}
  .line .q b{font-family:var(--mono); font-size:22px; min-width:34px; text-align:center}
  .bill{margin:18px 0 0; display:grid; gap:4px}
  .bill div{display:flex; justify-content:space-between; gap:12px}
  .bill dt{font-size:13px; color:var(--ink-soft)}
  .bill dd{margin:0; font-family:var(--mono); font-variant-numeric:tabular-nums}
  .bill .sum{border-top:1px solid var(--rule-soft); margin-top:4px; padding-top:8px}
  .bill .sum dt{font-weight:700; color:var(--ink); font-size:15px}
  .bill .sum dd{font-weight:700; font-size:19px}
  .staff{margin-top:18px; padding:14px; border:2px solid var(--ink); border-radius:8px}
  .staff p{font-size:13.5px; line-height:1.6}
  .staff .hint{margin-top:8px; font-size:11.5px; color:var(--muted); text-align:center}
  .small{margin-top:14px; text-align:center; font-size:12px; color:var(--muted)}
  .done{text-align:center; padding-top:40px}
  .done .no{font-family:var(--mono); font-size:44px; font-weight:700; margin:12px 0}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app"><p class="empty">…</p></div>
<script src="/guest.js"></script>
</body>
</html>
