<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>店舗用 — 京都ラボ お品書き</title>
<style>
  :root{
    color-scheme: light dark;
    --paper:#F5F5F7; --screen:#FFFFFF;
    --ink:#1D1D1F; --ink-soft:#4A4A4E; --muted:#6E6E73;
    --rule:rgba(0,0,0,.12); --rule-soft:rgba(0,0,0,.08);
    --accent:#0066CC; --accent-ink:#0052A6; --accent-soft:#EAF2FD;
    --ochre:#A33A2C;
    --alert:#9C4A34; --alert-soft:#F4E3DE;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#000000; --screen:#1C1C1E;
      --ink:#F5F5F7; --ink-soft:#C7C7CC; --muted:#98989D;
      --rule:rgba(255,255,255,.16); --rule-soft:rgba(255,255,255,.1);
      --accent:#0A84FF; --accent-ink:#5AC8FA; --accent-soft:#12233A;
      --ochre:#FF6F5E;
      --alert:#DE9280; --alert-soft:#33211C;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--paper)}
  body{color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased}
  h1,h2{margin:0; font-weight:700; letter-spacing:-.02em; line-height:1.3; font-feature-settings:"palt" 1}
  p{margin:0}
  button,input{font-family:inherit; font-size:inherit; color:inherit}
  button{cursor:pointer; border:none; background:none; padding:0}
  .app{max-width:640px; margin:0 auto; min-height:100vh; background:var(--screen)}
  .bar{position:sticky; top:0; z-index:5; background:var(--screen); padding:14px 16px 0; border-bottom:1px solid var(--rule-soft)}
  .bar .label{font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--ochre)}
  .bar h1{font-size:18px; margin-top:2px}
  .tabs{display:flex; margin-top:10px}
  .tabs button{flex:1; padding:10px 4px; font-size:14px; color:var(--muted); border-bottom:2px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:700}
  .body{padding:4px 16px 40px}
  .msg{margin-top:14px; padding:10px 12px; border-radius:4px; background:var(--alert-soft); color:var(--alert); font-size:13px}
  .lead{margin-top:14px; font-size:13px; color:var(--ink-soft)}

  .tog{display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; text-align:left; padding:14px 0; border-bottom:1px solid var(--rule-soft)}
  .tog small{display:block; font-size:12px; color:var(--muted)}
  .tog[aria-pressed="true"] small{color:var(--alert)}
  .sw{width:50px; height:28px; border-radius:99px; background:var(--rule); position:relative; flex:none}
  .sw::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:99px; background:var(--screen); box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .tog[aria-pressed="true"] .sw{background:var(--alert)}
  .tog[aria-pressed="true"] .sw::after{left:25px}

  .ord{padding:14px 0; border-bottom:1px solid var(--rule-soft)}
  .ord.void{opacity:.5}
  .ord .head{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .ord .no{font-family:var(--mono); font-weight:700}
  .ord .meta{font-size:12px; color:var(--muted)}
  .ord .items{margin-top:4px; font-size:14px}
  .ord .sum{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:6px; font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums}
  .ghost{font-size:12px; color:var(--accent-ink); border:1px solid var(--rule); border-radius:99px; padding:4px 12px; font-family:var(--sans)}
  .empty{padding:30px 0; text-align:center; color:var(--muted); font-size:13px}

  .month{display:flex; justify-content:center; align-items:center; gap:18px; margin-top:16px}
  .month b{font-family:var(--mono); font-size:18px}
  .month button{width:38px; height:38px; border:1px solid var(--rule); border-radius:99px; color:var(--accent-ink); font-size:18px}
  .figs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:16px}
  .figs div{background:var(--paper); border-radius:8px; padding:12px 14px}
  .figs span{display:block; font-size:12px; color:var(--muted)}
  .figs b{display:block; font-family:var(--mono); font-size:22px; font-variant-numeric:tabular-nums}
  .figs .main{grid-column:1/-1}
  .figs .main b{font-size:28px}
  .primary{display:block; width:100%; margin-top:16px; padding:14px; border-radius:8px; background:var(--accent); color:var(--screen); font-weight:700}
  .keyform{padding:24px 16px}
  .keyform input{display:block; width:100%; margin-top:10px; padding:12px; border:1px solid var(--rule); border-radius:8px; background:var(--screen); font-family:var(--mono); font-size:14px}
  .foot{margin-top:28px; text-align:center}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app"><p class="empty">…</p></div>
<script src="/staff.js"></script>
</body>
</html>
