<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QRコードの札を印刷 ／ 京都ラボ</title>
<meta name="description" content="多言語お品書きのQRコードを、席や入口に置く札として印刷します。">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://kyotolab.github.io/tools/menu/print/">
<meta property="og:type" content="website">
<meta property="og:title" content="QRコードの札を印刷 ／ 京都ラボ">
<meta property="og:description" content="多言語お品書きのQRコードを、席や入口に置く札として印刷します。">
<meta property="og:url" content="https://kyotolab.github.io/tools/menu/print/">
<meta property="og:image" content="https://kyotolab.github.io/assets/menu.jpg">
<meta property="og:site_name" content="京都ラボ">
<style>
  :root{
    --paper:#F5F5F7; --surface:#FFFFFF; --ink:#1D1D1F; --ink-soft:#4A4A4E; --muted:#6E6E73;
    --rule:rgba(0,0,0,.12); --accent:#0066CC; --accent-ink:#0052A6; --gold:#A33A2C;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6}
  h1,h2{margin:0; font-feature-settings:"palt" 1; line-height:1.3}
  p{margin:0}
  .bar{max-width:820px; margin:0 auto; padding:20px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between}
  .bar h1{font-size:18px}
  .bar p{font-size:13px; color:var(--ink-soft)}
  .bar button{min-height:44px; padding:0 20px; border:none; border-radius:8px; background:var(--accent); color:var(--surface); font:inherit; font-weight:700; cursor:pointer}
  .sheet{width:210mm; max-width:100%; margin:0 auto 40px; background:var(--surface); display:grid; grid-template-columns:1fr 1fr; box-shadow:0 10px 30px -20px rgba(0,0,0,.4)}
  .card{aspect-ratio:105/148.5; padding:9mm 8mm; border:1px dashed var(--rule); display:flex; flex-direction:column; align-items:center; text-align:center}
  .card .shop{font-size:13pt; font-weight:700}
  .card .shop-en{font-size:8.5pt; color:var(--muted)}
  .card .ttl{margin-top:4mm; font-size:19pt; font-weight:800; letter-spacing:-.01em}
  .card .ttl-sub{font-size:9pt; color:var(--gold); font-weight:600}
  .card .qr{width:52mm; height:52mm; margin-top:4mm}
  .card .qr svg{width:100%; height:100%; display:block}
  .card .scan{margin-top:3mm; font-size:8.5pt; color:var(--ink-soft); line-height:1.55}
  .card .feat{margin-top:auto; font-size:7.5pt; color:var(--muted)}
  .card .url{font-size:6.5pt; color:var(--muted); word-break:break-all; margin-top:1mm}
  @media (max-width:600px){ .sheet{grid-template-columns:1fr} }
  @media print{
    @page{size:A4; margin:0}
    body{background:#fff}
    .bar{display:none}
    .sheet{width:210mm; height:297mm; margin:0; box-shadow:none; grid-template-columns:1fr 1fr}
    .card{aspect-ratio:auto; height:148.5mm}
  }
</style>
</head>
<body>
<div class="bar">
  <div><h1>QRコードの札</h1><p>A4に4枚。点線で切って、席や入口に置いてください。</p></div>
  <button id="print">印刷する</button>
</div>
<div class="sheet" id="sheet"></div>

<script src="../core.js"></script>
<script src="../qr.js"></script>
<script>
(function(){
  "use strict";
  var K = window.KLMenu, esc = K.esc;
  document.getElementById("print").addEventListener("click", function(){ window.print(); });

  function draw(menu, id){
    var url = "https://kyotolab.github.io/tools/menu/app/?shop=" + encodeURIComponent(id);
    var qr = window.KLQR.svg(url, {margin:2, label:"QR code: " + url});
    var one = '<div class="card">' +
      '<p class="shop">' + esc(menu.shop.name.ja || "") + '</p>' +
      (menu.shop.name.en ? '<p class="shop-en">' + esc(menu.shop.name.en) + '</p>' : '') +
      '<p class="ttl">Menu</p><p class="ttl-sub">English ・ 中文 ・ 한국어 ・ 日本語</p>' +
      '<div class="qr">' + qr + '</div>' +
      '<p class="scan">Scan with your phone camera.<br>請用手機相機掃描。<br>휴대폰 카메라로 스캔하세요.</p>' +
      '<p class="feat">Allergy &amp; vegetarian filters ・ Show your order to the staff</p>' +
      '<p class="url">' + esc(url) + '</p></div>';
    document.getElementById("sheet").innerHTML = one + one + one + one;
  }

  var q = new URLSearchParams(location.search);
  var id = (q.get("shop") || "demo").replace(/[^a-z0-9-]/gi, "");
  fetch("../shops/" + id + ".json", {cache:"no-cache"}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){ draw(K.normalize(j), id); })
    .catch(function(){
      // まだ公開していない店は、編集画面の下書きの店名で刷る
      var m = null;
      try{ m = K.normalize(JSON.parse(localStorage.getItem(K.DRAFT_KEY))); }catch(e){}
      draw(m || K.normalize({}), id);
    });
})();
</script>
</body>
</html>
