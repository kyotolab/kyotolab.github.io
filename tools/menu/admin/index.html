<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>お品書きの編集 ／ 京都ラボ</title>
<meta name="description" content="多言語お品書きの店舗用の編集画面。料理、値段、アレルゲン、品切れを直して、お客さんの画面で確かめられます。">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://kyotolab.github.io/tools/menu/admin/">
<meta property="og:type" content="website">
<meta property="og:title" content="お品書きの編集 ／ 京都ラボ">
<meta property="og:description" content="多言語お品書きの店舗用の編集画面。料理、値段、アレルゲン、品切れを直して、お客さんの画面で確かめられます。">
<meta property="og:url" content="https://kyotolab.github.io/tools/menu/admin/">
<meta property="og:image" content="https://kyotolab.github.io/assets/menu.jpg">
<meta property="og:site_name" content="京都ラボ">
<style>
  :root{
    --paper:#F5F5F7; --surface:#FFFFFF;
    --ink:#1D1D1F; --ink-soft:#4A4A4E; --muted:#6E6E73;
    --rule:rgba(0,0,0,.12); --rule-soft:rgba(0,0,0,.08);
    --accent:#0066CC; --accent-ink:#0052A6; --accent-soft:#EAF2FD;
    --gold:#A33A2C; --gold-soft:#FBEDEA;
    --alert:#9C4A34; --alert-soft:#F4E3DE;
    --ok:#2F6B3A; --ok-soft:#E6F2E8;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#000000; --surface:#1C1C1E;
      --ink:#F5F5F7; --ink-soft:#C7C7CC; --muted:#98989D;
      --rule:rgba(255,255,255,.16); --rule-soft:rgba(255,255,255,.1);
      --accent:#0A84FF; --accent-ink:#5AC8FA; --accent-soft:#12233A;
      --gold:#FF6F5E; --gold-soft:#2B1512;
      --alert:#DE9280; --alert-soft:#33211C;
      --ok:#7FCB8C; --ok-soft:#15261A;
    }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0; line-height:1.3; font-feature-settings:"palt" 1}
  p{margin:0}
  button, input, select, textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .wrap{max-width:880px; margin:0 auto; padding:0 16px 80px}
  .top{position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--rule); margin:0 -16px; padding:12px 16px}
  .top-in{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
  .top h1{font-size:18px}
  .top .saved{font-size:12px; color:var(--muted)}
  .acts{display:flex; flex-wrap:wrap; gap:6px}
  .btn{min-height:40px; padding:0 14px; border:1px solid var(--rule); border-radius:8px; background:var(--surface); color:var(--accent-ink); font-size:14px; white-space:nowrap}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--surface); font-weight:700}
  .btn.danger{color:var(--alert)}
  .btn.small{min-height:32px; padding:0 10px; font-size:13px}
  .tabs{display:flex; gap:4px; margin-top:10px; overflow-x:auto}
  .tabs button{border:none; background:none; padding:6px 10px; border-bottom:2px solid transparent; color:var(--muted); white-space:nowrap; font-size:14px}
  .tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
  .tabs .badge{display:inline-block; min-width:18px; margin-left:4px; padding:0 5px; border-radius:99px; background:var(--alert-soft); color:var(--alert); font-size:11px}

  .intro{margin-top:18px; font-size:13.5px; color:var(--ink-soft)}
  .panel{margin-top:16px}
  .card{background:var(--surface); border:1px solid var(--rule-soft); border-radius:10px; padding:16px; margin-top:12px}
  .card h2{font-size:16px; margin-bottom:10px}
  .card h3, .dish-body h3{font-size:13px; color:var(--gold); margin:22px 0 4px; font-weight:600}
  label.f{display:block; margin-top:10px}
  label.f > span{display:block; font-size:12.5px; color:var(--muted); margin-bottom:3px}
  input[type=text], input[type=number], select, textarea{width:100%; min-height:40px; padding:7px 10px; border:1px solid var(--rule); border-radius:6px; background:var(--paper)}
  textarea{min-height:64px; resize:vertical}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 12px}
  @media (max-width:560px){ .grid2, .grid3{grid-template-columns:1fr} }
  .checks{display:flex; flex-wrap:wrap; gap:6px}
  .checks label{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--rule); border-radius:99px; padding:4px 11px; font-size:13.5px; cursor:pointer; background:var(--paper)}
  .checks label.req{font-weight:600}
  .checks input{margin:0; width:16px; height:16px}
  .checks label:has(input:checked){background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
  .hint{font-size:12px; color:var(--muted); margin-top:6px}
  .hint a{color:var(--accent-ink)}

  details.dish{background:var(--surface); border:1px solid var(--rule-soft); border-radius:10px; margin-top:10px}
  details.dish > summary{list-style:none; cursor:pointer; padding:12px 14px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center}
  details.dish > summary::-webkit-details-marker{display:none}
  details.dish > summary .nm{font-weight:600}
  details.dish > summary .meta{display:block; font-size:12px; color:var(--muted)}
  details.dish > summary .price{font-family:var(--mono)}
  details.dish[open] > summary{border-bottom:1px solid var(--rule-soft)}
  .dish-body{padding:4px 14px 16px}
  .tag{display:inline-block; font-size:11px; padding:0 6px; border-radius:3px; margin-left:4px; vertical-align:1px}
  .tag.out{background:var(--alert-soft); color:var(--alert)}
  .tag.miss{background:var(--gold-soft); color:var(--gold)}
  .rowbtns{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; padding-top:12px; border-top:1px solid var(--rule-soft)}
  .catsec{margin-top:22px; font-size:13px; color:var(--gold); font-weight:600}

  .sw{width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border:none; border-bottom:1px solid var(--rule-soft); background:var(--surface); text-align:left; font-size:15px}
  .sw:first-child{border-radius:10px 10px 0 0}
  .sw small{display:block; font-size:12px; color:var(--muted)}
  .sw .t{width:48px; height:28px; border-radius:99px; background:var(--rule); position:relative; flex:none}
  .sw .t::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:99px; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .15s}
  .sw[aria-pressed="true"] .t{background:var(--alert)}
  .sw[aria-pressed="true"] .t::after{transform:translateX(20px)}
  .swlist{border:1px solid var(--rule-soft); border-radius:10px; overflow:hidden; margin-top:12px}

  .issues{list-style:none; margin:0; padding:0}
  .issues li{padding:10px 12px; border-bottom:1px solid var(--rule-soft); font-size:14px; display:flex; gap:10px; align-items:baseline}
  .issues li b{flex:none; font-size:11px; padding:0 6px; border-radius:3px}
  .issues li.err b{background:var(--alert-soft); color:var(--alert)}
  .issues li.warn b{background:var(--gold-soft); color:var(--gold)}
  .issues li button{margin-left:auto; flex:none}
  .ok{color:var(--ok); background:var(--ok-soft); border-radius:8px; padding:12px 14px; font-size:14px}
  .steps{margin:8px 0 0; padding-left:1.4em; font-size:14px; color:var(--ink-soft)}
  .steps li + li{margin-top:4px}
  .cat-row{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)) auto; gap:8px; align-items:end; padding:10px 0; border-bottom:1px solid var(--rule-soft)}
  @media (max-width:640px){ .cat-row{grid-template-columns:1fr 1fr} .cat-row .rb{grid-column:1/-1} }
  .cat-row .rb{display:flex; gap:4px}
  input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-in">
      <div><h1 id="title">お品書きの編集</h1><p class="saved" id="saved">この端末に下書きとして保存されます</p></div>
      <div class="acts">
        <button class="btn" id="b-preview">お客さんの画面で見る</button>
        <button class="btn primary" id="b-export">書き出す</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>
<input type="file" id="file" accept="application/json,.json">

<script src="../core.js"></script>
<script>
(function(){
  "use strict";
  var K = window.KLMenu, esc = K.esc, yen = K.yen;
  var L = ["ja","en","zh","ko"], LN = {ja:"日本語", en:"英語", zh:"中国語（繁体）", ko:"韓国語"};
  var VEG = {"":"とくになし", vegetarian:"ベジタリアン（肉・魚・魚のだしなし）", vegan:"ヴィーガン（卵・乳・はちみつもなし）"};
  var PAY = {cash:"現金", card:"クレジットカード", ic:"交通系IC", qr:"QR決済"};
  var TABS = [["soldout","今日の品切れ"],["dishes","料理"],["cats","分類"],["shop","店の情報"],["check","公開前の確認"],["file","ファイルとQR"]];
  var menu, tab = "soldout", openId = null;

  /* ---- 下書き ---- */
  function saveDraft(){
    menu.updated = new Date().toISOString().slice(0, 10);
    try{
      localStorage.setItem(K.DRAFT_KEY, JSON.stringify(menu));
      var d = new Date();
      document.getElementById("saved").textContent = "下書きを保存しました " + d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0") + "（この端末だけ）";
    }catch(e){
      document.getElementById("saved").textContent = "この端末に保存できません。書き出して残してください。";
    }
    renderTabs();
  }
  function loadDraft(){
    try{ var r = localStorage.getItem(K.DRAFT_KEY); if(r) return K.normalize(JSON.parse(r)); }catch(e){}
    return null;
  }
  function newId(p){ return p + Date.now().toString(36) + Math.floor(Math.random()*36).toString(36); }

  /* ---- 値の読み書き（data-path="dishes.3.name.en" の形） ---- */
  function getPath(path){ return path.split(".").reduce(function(o, k){ return o == null ? undefined : o[k]; }, menu); }
  function setPath(path, v){
    var ks = path.split("."), o = menu;
    for(var i = 0; i < ks.length - 1; i++){ if(o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
    o[ks[ks.length - 1]] = v;
  }
  function inp(path, label, opt){
    opt = opt || {};
    var v = getPath(path); if(v == null) v = "";
    var tag = opt.area ? '<textarea data-path="' + path + '"' + (opt.ph ? ' placeholder="' + esc(opt.ph) + '"' : '') + '>' + esc(v) + '</textarea>' :
      '<input type="' + (opt.num ? "number" : "text") + '"' + (opt.num ? ' inputmode="numeric" min="0" step="10"' : '') + ' data-path="' + path + '"' + (opt.num ? ' data-num="1"' : '') + ' value="' + esc(v) + '"' + (opt.ph ? ' placeholder="' + esc(opt.ph) + '"' : '') + (opt.lang ? ' lang="' + opt.lang + '"' : '') + '>';
    return '<label class="f"><span>' + esc(label) + '</span>' + tag + '</label>';
  }
  function langInputs(base, label, area){
    return '<div class="grid2">' + L.map(function(l){ return inp(base + "." + l, label + "（" + LN[l] + (l === "ja" ? "・必須" : "") + "）", {area: area, lang: l}); }).join("") + '</div>';
  }
  function trLink(text){
    if(!text) return "";
    return '<p class="hint">訳の下書きがほしいとき: <a href="https://translate.google.com/?sl=ja&tl=en&text=' + encodeURIComponent(text) + '" target="_blank" rel="noopener">Google翻訳で開く</a>（訳は必ず人の目で確かめてください）</p>';
  }

  /* ---- 画面 ---- */
  function renderTabs(){
    var n = issues().length;
    document.getElementById("tabs").innerHTML = TABS.map(function(x){
      return '<button role="tab" data-tab="' + x[0] + '" aria-selected="' + (tab === x[0]) + '">' + x[1] + (x[0] === "check" && n ? '<span class="badge">' + n + '</span>' : '') + '</button>';
    }).join("");
    document.getElementById("title").textContent = (K.pick(menu.shop.name, "ja") || "お品書き") + " の編集";
  }

  function render(){
    renderTabs();
    var h = "";
    if(tab === "soldout" && K.liveUrl(menu)){
      var su = "../staff/?shop=" + encodeURIComponent(menu.id || "demo");
      h = '<div class="card"><h2>品切れは、店員さん用の画面で切り替えます</h2>' +
        '<p class="hint" style="font-size:14px;color:var(--ink-soft)">タップするとすぐ、お客さんのスマホで「品切れ」と出ます（およそ1分以内）。書き出しや京都ラボへの連絡はいりません。店のスマホのホーム画面に置いておくと便利です。</p>' +
        '<p style="margin-top:12px"><a class="btn primary" style="display:inline-grid;place-items:center;text-decoration:none" href=\"' + su + '\" target="_blank" rel="noopener">品切れの切り替えを開く</a></p>' +
        (menu.live === "demo" ? '<p class="hint">デモのPINは 0000 です。</p>' : '') + '</div>';
    }
    else if(tab === "soldout"){
      h = '<p class="intro">切れたらタップ。お客さんの画面では「品切れ」と出て、注文リストに入れられなくなります。</p><div class="swlist">' +
        menu.dishes.map(function(d, i){
          return '<button class="sw" data-sold="' + i + '" aria-pressed="' + !!d.soldout + '"><span>' + esc(d.name.ja || "（名前なし）") + '<small>' + yen(d.price) + ' ・ ' + (d.soldout ? "品切れ" : "出せる") + '</small></span><span class="t"></span></button>';
        }).join("") + '</div>' +
        '<p class="hint" style="margin-top:12px">このお品書きは、まだ品切れの切り替えがつながっていません。ここで切り替えたものは「書き出す」から京都ラボに送ると反映されます。店のスマホからすぐ切り替えたいときは、京都ラボに設定を頼んでください。</p>';
    }
    if(tab === "dishes"){
      h = '<p class="intro">料理をタップすると開きます。日本語だけ入れておけば、訳は京都ラボで確かめてから入れることもできます。</p>';
      var cats = menu.categories.concat([{id:"", name:{ja:"分類なし"}}]);
      cats.forEach(function(c){
        var ds = menu.dishes.map(function(d, i){ return {d:d, i:i}; }).filter(function(x){
          return c.id ? x.d.cat === c.id : !menu.categories.some(function(cc){ return cc.id === x.d.cat; });
        });
        if(!ds.length && !c.id) return;
        h += '<p class="catsec">' + esc(c.name.ja || c.id) + '</p>' + ds.map(function(x){ return dishForm(x.d, x.i); }).join("") +
          (c.id ? '<p style="margin-top:8px"><button class="btn small" data-add="' + esc(c.id) + '">＋ ' + esc(c.name.ja || "") + ' に料理を足す</button></p>' : '');
      });
    }
    if(tab === "cats"){
      h = '<p class="intro">お品書きの見出しです。上から順に出ます。</p><div class="card">' +
        menu.categories.map(function(c, i){
          return '<div class="cat-row">' + L.map(function(l){ return inp("categories." + i + ".name." + l, LN[l]); }).join("") +
            '<div class="rb"><button class="btn small" data-cmove="' + i + ':-1" aria-label="上へ">↑</button><button class="btn small" data-cmove="' + i + ':1" aria-label="下へ">↓</button><button class="btn small danger" data-cdel="' + i + '">消す</button></div></div>';
        }).join("") + '<p style="margin-top:12px"><button class="btn small" data-cadd="1">＋ 分類を足す</button></p></div>';
    }
    if(tab === "shop"){
      h = '<div class="card"><h2>店の名前</h2>' + langInputs("shop.name", "店名") +
        '<h3>お知らせ（上に小さく出ます）</h3>' + langInputs("shop.notice", "お知らせ", true) + trLink(menu.shop.notice.ja) +
        '<h3>お支払い</h3><div class="checks">' + Object.keys(PAY).map(function(k){
          return '<label><input type="checkbox" data-pay="' + k + '"' + (menu.shop.pay.indexOf(k) > -1 ? " checked" : "") + '>' + PAY[k] + '</label>';
        }).join("") + '</div>' +
        '<h3>値段</h3><div class="checks"><label><input type="checkbox" data-tax="1"' + (menu.shop.taxIncluded ? " checked" : "") + '>税込の値段を書いている</label></div>' +
        '<p class="hint">お客さんに見せる値段は、税込の総額で出すことが義務になっています（総額表示）。</p>' +
        '<h3>お品書きのID</h3>' + inp("id", "英小文字と数字（QRコードのURLに入ります）", {ph:"例: gion-soba"}) +
        '<h3>品切れの接続先（京都ラボが設定します）</h3>' + inp("live", "Google Apps Script のURL", {ph:"https://script.google.com/macros/s/…/exec"}) +
        '<p class="hint">ここが入っていると、店員さん用の画面から品切れをすぐ切り替えられます。</p></div>';
    }
    if(tab === "check"){
      var is = issues();
      h = '<div class="card"><h2>公開前の確認</h2>' + (is.length ?
        '<ul class="issues">' + is.map(function(x){ return '<li class="' + x.lv + '"><b>' + (x.lv === "err" ? "直す" : "見る") + '</b><span>' + esc(x.msg) + '</span>' + (x.dish != null ? '<button class="btn small" data-goto="' + x.dish + '">開く</button>' : '') + '</li>'; }).join("") + '</ul>' :
        '<p class="ok">抜けはありません。お客さんの画面で見てから、書き出してください。</p>') + '</div>' +
        '<div class="card"><h2>お客さんの画面に出すまで</h2><ol class="steps">' +
          '<li>「お客さんの画面で見る」で、スマホでの見え方を確かめる</li>' +
          '<li>「書き出す」でファイル（' + esc((menu.id || "menu") + ".json") + '）を保存する</li>' +
          '<li>そのファイルを京都ラボに送る。確かめてから公開します</li>' +
          '<li>はじめてのときは「ファイルとQR」の「QRコードを印刷」で、席に置く札を刷る</li>' +
        '</ol></div>';
    }
    if(tab === "file"){
      h = '<div class="card"><h2>QRコード</h2><p class="hint">席や入口に置く札を刷ります。A4に4枚です。</p><p style="margin-top:10px"><button class="btn primary" data-act="print">QRコードを印刷</button></p></div>' +
        '<div class="card"><h2>ファイル</h2><p class="hint">下書きはこの端末のブラウザにだけ残ります。別の端末で直すときは、書き出したファイルを開いてください。</p>' +
        '<div class="acts" style="margin-top:10px"><button class="btn" data-act="open">ファイルを開く</button><button class="btn" data-act="demo">デモの店を読み込む</button><button class="btn danger" data-act="blank">空から始める</button></div></div>';
    }
    document.getElementById("main").innerHTML = h;
  }

  function dishForm(d, i){
    var p = "dishes." + i, miss = L.slice(1).filter(function(l){ return !d.name[l]; }).length;
    var open = openId === d.id;
    return '<details class="dish" data-id="' + esc(d.id) + '"' + (open ? " open" : "") + '><summary><span><span class="nm">' + esc(d.name.ja || "（名前なし）") + '</span>' +
        (d.soldout ? '<span class="tag out">品切れ</span>' : '') + (miss ? '<span class="tag miss">訳なし ' + miss + '</span>' : '') +
        '<span class="meta">' + esc([d.name.en, d.allergens.length ? "アレルゲン " + d.allergens.length : "アレルゲンなし"].filter(Boolean).join(" ・ ")) + '</span></span>' +
        '<span class="price">' + yen(d.price) + '</span></summary>' +
      (open ? '<div class="dish-body">' +
        '<div class="grid3">' + inp(p + ".price", "値段（円）", {num:1}) +
          '<label class="f"><span>分類</span><select data-path="' + p + '.cat">' + menu.categories.map(function(c){ return '<option value="' + esc(c.id) + '"' + (c.id === d.cat ? " selected" : "") + '>' + esc(c.name.ja || c.id) + '</option>'; }).join("") + '</select></label>' +
          '<label class="f"><span>絵（写真がないとき）</span><select data-path="' + p + '.icon">' + Object.keys(K.ICONS).map(function(k){ return '<option' + (k === d.icon ? " selected" : "") + '>' + k + '</option>'; }).join("") + '</select></label>' +
        '</div>' +
        '<h3>料理名</h3>' + langInputs(p + ".name", "料理名") + trLink(d.name.ja) +
        '<h3>ひとこと説明</h3>' + langInputs(p + ".desc", "説明", true) + trLink(d.desc.ja) +
        '<h3>アレルゲン（太字は表示義務のある8品目）</h3><div class="checks">' + K.ALLERGENS.map(function(a){
          return '<label' + (a.req ? ' class="req"' : '') + '><input type="checkbox" data-al="' + i + ':' + a.k + '"' + (d.allergens.indexOf(a.k) > -1 ? " checked" : "") + '>' + esc(a.ja) + '</label>';
        }).join("") + '</div>' +
        '<p class="hint">だしや調味料に入っているものも含めて選んでください（しょうゆ → 小麦・大豆、など）。</p>' +
        '<h3>ほかに入っているもの</h3><div class="checks">' + K.CONTAINS.map(function(a){
          return '<label><input type="checkbox" data-co="' + i + ':' + a.k + '"' + (d.contains.indexOf(a.k) > -1 ? " checked" : "") + '>' + esc(a.ja) + '</label>';
        }).join("") + '</div>' +
        '<div class="grid2"><label class="f"><span>食事の制限</span><select data-path="' + p + '.veg">' + Object.keys(VEG).map(function(k){ return '<option value="' + k + '"' + (k === d.veg ? " selected" : "") + '>' + VEG[k] + '</option>'; }).join("") + '</select></label>' +
          inp(p + ".img", "写真のファイル名（あれば）", {ph:"例: demo/yuba.jpg"}) + '</div>' +
        '<div class="checks" style="margin-top:12px"><label><input type="checkbox" data-flag="' + i + ':recommend"' + (d.recommend ? " checked" : "") + '>おすすめ</label>' +
          '<label><input type="checkbox" data-flag="' + i + ':soldout"' + (d.soldout ? " checked" : "") + '>品切れ</label></div>' +
        '<div class="rowbtns"><button class="btn small" data-move="' + i + ':-1">↑ 上へ</button><button class="btn small" data-move="' + i + ':1">↓ 下へ</button>' +
          '<button class="btn small" data-dup="' + i + '">複製</button><button class="btn small danger" data-del="' + i + '">消す</button></div>' +
      '</div>' : '') + '</details>';
  }

  /* ---- 確認 ---- */
  function issues(){
    var out = [];
    if(!menu.shop.name.ja) out.push({lv:"err", msg:"店名（日本語）がありません"});
    if(!/^[a-z0-9-]+$/.test(menu.id || "")) out.push({lv:"err", msg:"お品書きのIDは英小文字・数字・ハイフンにしてください（店の情報）"});
    if(menu.live && !K.liveUrl(menu)) out.push({lv:"err", msg:"品切れの接続先のURLの形がちがいます（店の情報）"});
    if(!menu.categories.length) out.push({lv:"err", msg:"分類がひとつもありません"});
    if(!menu.shop.taxIncluded) out.push({lv:"warn", msg:"値段が税別になっています。お客さんに見せる値段は税込の総額にしてください（店の情報）"});
    menu.dishes.forEach(function(d, i){
      var n = d.name.ja || "（名前なし）";
      if(!d.name.ja) out.push({lv:"err", dish:i, msg:"料理名（日本語）がありません"});
      if(!(d.price > 0)) out.push({lv:"err", dish:i, msg:n + ": 値段が入っていません"});
      if(!menu.categories.some(function(c){ return c.id === d.cat; })) out.push({lv:"err", dish:i, msg:n + ": 分類が選ばれていません"});
      var meat = ["pork","beef","chicken","mackerel","salmon","shrimp","crab","squid","abalone","ikura","gelatin"].filter(function(k){ return d.allergens.indexOf(k) > -1; });
      if(d.veg && (meat.length || d.contains.indexOf("dashi") > -1)) out.push({lv:"err", dish:i, msg:n + ": ベジタリアンにしていますが、肉・魚・魚のだしのどれかが入っています"});
      if(d.veg === "vegan" && (d.allergens.indexOf("egg") > -1 || d.allergens.indexOf("milk") > -1)) out.push({lv:"err", dish:i, msg:n + ": ヴィーガンにしていますが、卵か乳が入っています"});
      var miss = L.slice(1).filter(function(l){ return !d.name[l]; }).map(function(l){ return LN[l]; });
      if(miss.length) out.push({lv:"warn", dish:i, msg:n + ": 料理名の訳がありません（" + miss.join("・") + "）。英語か日本語で代わりに出ます"});
      if(d.desc.ja && L.slice(1).some(function(l){ return !d.desc[l]; })) out.push({lv:"warn", dish:i, msg:n + ": 説明の訳が足りません"});
    });
    return out;
  }

  /* ---- 操作 ---- */
  var main = document.getElementById("main");
  main.addEventListener("input", function(e){
    var el = e.target, path = el.dataset.path;
    if(!path) return;
    var v = el.value;
    if(el.dataset.num) v = Math.max(0, Math.round(Number(v) || 0));
    if(path === "id") v = v.toLowerCase().replace(/[^a-z0-9-]/g, "");
    setPath(path, v);
    if(el.tagName === "SELECT"){ saveDraft(); render(); return; }
    saveDraft();
  });
  main.addEventListener("change", function(e){
    var el = e.target, ds = el.dataset, a, d;
    function toggleIn(arr, k, on){ var j = arr.indexOf(k); if(on && j < 0) arr.push(k); if(!on && j > -1) arr.splice(j, 1); }
    if(ds.al){ a = ds.al.split(":"); toggleIn(menu.dishes[+a[0]].allergens, a[1], el.checked); }
    else if(ds.co){ a = ds.co.split(":"); toggleIn(menu.dishes[+a[0]].contains, a[1], el.checked); }
    else if(ds.flag){ a = ds.flag.split(":"); d = menu.dishes[+a[0]]; if(el.checked) d[a[1]] = true; else delete d[a[1]]; }
    else if(ds.pay){ toggleIn(menu.shop.pay, ds.pay, el.checked); }
    else if(ds.tax){ menu.shop.taxIncluded = el.checked; }
    else return;
    saveDraft();
  });
  main.addEventListener("toggle", function(e){
    var det = e.target;
    if(!det.classList || !det.classList.contains("dish")) return;
    if(det.open && openId !== det.dataset.id){ openId = det.dataset.id; render(); }
    else if(!det.open && openId === det.dataset.id){ openId = null; render(); }
  }, true);
  function swap(arr, i, dir){ var j = i + dir; if(j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  main.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    var ds = b.dataset, a;
    if(ds.sold != null){ var d = menu.dishes[+ds.sold]; if(d.soldout) delete d.soldout; else d.soldout = true; }
    else if(ds.add != null){ var nd = {id:newId("d"), cat:ds.add, icon:"donburi", price:0, name:{ja:""}, desc:{}, allergens:[], contains:[], veg:""}; menu.dishes.push(nd); openId = nd.id; }
    else if(ds.move){ a = ds.move.split(":"); var src = menu.dishes[+a[0]], sib = menu.dishes.map(function(x, k){ return k; }).filter(function(k){ return menu.dishes[k].cat === src.cat; }); var pos = sib.indexOf(+a[0]) + (+a[1]); if(pos >= 0 && pos < sib.length){ menu.dishes[+a[0]] = menu.dishes[sib[pos]]; menu.dishes[sib[pos]] = src; } }
    else if(ds.dup){ var c = JSON.parse(JSON.stringify(menu.dishes[+ds.dup])); c.id = newId("d"); c.name.ja = (c.name.ja || "") + "（コピー）"; menu.dishes.splice(+ds.dup + 1, 0, c); openId = c.id; }
    else if(ds.del){ if(!confirm("「" + (menu.dishes[+ds.del].name.ja || "この料理") + "」を消しますか？")) return; menu.dishes.splice(+ds.del, 1); }
    else if(ds.cadd){ menu.categories.push({id:newId("c"), name:{ja:"新しい分類"}}); }
    else if(ds.cmove){ a = ds.cmove.split(":"); swap(menu.categories, +a[0], +a[1]); }
    else if(ds.cdel){ var cc = menu.categories[+ds.cdel]; var used = menu.dishes.filter(function(x){ return x.cat === cc.id; }).length; if(!confirm("分類「" + (cc.name.ja || "") + "」を消しますか？" + (used ? "\n中の料理 " + used + " 品は「分類なし」になります。" : ""))) return; menu.categories.splice(+ds.cdel, 1); }
    else if(ds["goto"] != null){ openId = menu.dishes[+ds["goto"]].id; tab = "dishes"; render(); var el = document.querySelector('details[data-id="' + openId + '"]'); if(el) el.scrollIntoView({block:"start"}); return; }
    else return;
    saveDraft(); render();
  });
  document.getElementById("tabs").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    tab = b.dataset.tab; render(); window.scrollTo(0, 0);
  });

  document.getElementById("b-preview").addEventListener("click", function(){
    saveDraft();
    window.open("../app/?preview=1", "_blank");
  });
  document.getElementById("b-export").addEventListener("click", function(){
    var errs = issues().filter(function(x){ return x.lv === "err"; });
    if(errs.length && !confirm("直すところが " + errs.length + " 件あります（公開前の確認）。このまま書き出しますか？")) return;
    var blob = new Blob([JSON.stringify(menu, null, 2) + "\n"], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (menu.id || "menu") + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });
  main.addEventListener("click", function(e){
    var b = e.target.closest("button[data-act]"); if(!b) return;
    var c = {print:"1", open:"2", demo:"3", blank:"4"}[b.dataset.act];
    if(c === "1"){ saveDraft(); window.open("../print/?shop=" + encodeURIComponent(menu.id || "demo"), "_blank"); }
    if(c === "2") document.getElementById("file").click();
    if(c === "3" && confirm("いまの下書きをデモの店で置き換えます。よろしいですか？")) loadRemote("demo");
    if(c === "4" && confirm("いまの下書きを消して、空から始めます。よろしいですか？")){
      menu = K.normalize({version:1, id:"", shop:{name:{ja:""}, taxIncluded:true, pay:["cash"]}, categories:[{id:"c1", name:{ja:"お食事", en:"Meals", zh:"餐點", ko:"식사"}}], dishes:[]});
      tab = "shop"; saveDraft(); render();
    }
  });
  document.getElementById("file").addEventListener("change", function(e){
    var f = e.target.files[0]; if(!f) return;
    f.text().then(function(s){ menu = K.normalize(JSON.parse(s)); saveDraft(); render(); })
      .catch(function(){ alert("このファイルは読めませんでした。書き出した .json を選んでください。"); });
    e.target.value = "";
  });

  function loadRemote(id){
    return fetch("../shops/" + id + ".json", {cache:"no-cache"}).then(function(r){ return r.json(); })
      .then(function(j){ menu = K.normalize(j); saveDraft(); render(); });
  }

  var draft = loadDraft();
  var q = new URLSearchParams(location.search).get("shop");
  if(q) loadRemote(q.replace(/[^a-z0-9-]/gi, "")).catch(function(){ menu = draft || K.normalize({}); render(); });
  else if(draft){ menu = draft; render(); }
  else loadRemote("demo").catch(function(){ menu = K.normalize({}); render(); });
})();
</script>
</body>
</html>
